{% load static %}
<div class="mx-auto hidden lg:flex justify-between py-[16px] border-b-[2px] border-[#EBEBEE]">
  <div class="hidden lg:flex justify-between lg:container mx-auto">
    <ul class="flex gap-[24px] mb-0">
      <li class="flex">
        <a href="{% url 'counselor:landing' %}">
          <img src="{% static 'topteenfrontend/assets/images/logo.svg' %}" class="w-[38.5px] h-[38.5px]" alt="">
        </a>
        <a href="{% url 'counselor:landing' %}">
          <p class="text-[13.8px] leading-[18px] mt-[14px] ml-[8px] font-bold text-[#494949] tracking-[0.01em]">TOPTEEN</p>
        </a>
      </li>
      <li class="flex">
        <i class="fa fa-search mt-[15px] -mr-[32px] text-[#bdbdbd] z-[20]" aria-hidden="true"></i>
        <form action="/searchand-explore-result" method="get" autocomplete="off" class="mb-0">
          <div class="relative">
            <input name="search" type="text" placeholder=" Careers, colleges, courses..."
              class="searchBox searchinput h-[48px] w-[300px] rounded-[10px] pl-[36px] bg-[#f7f7fa] border-[1.5px] border-solid border-[#dcdcdc] placeholder-[#bdbdbd] z-[10]"
              id="collegesearch" onfocus="focusFunc()" required="" oninput="inputFunc()" value="">
            <div id="searchresults"></div>
          </div>
        </form>
      </li>
    </ul>
    <ul class="flex gap-[12px] mb-0">
      <a href="/user/user-feeds">
        <li class="flex">
          <img src="https://www.topteen.in/static/topteenfrontend/assets/images/discover.svg" class="w-[22px] h-[22px] mt-[10px]" alt="">
          <p class="text-[14px] leading-[19px] font-semibold mt-[12px] ml-[4px]">Discover</p>
        </li>
      </a>
      <a href="/testprep/">
        <li class="flex">
          <img src="https://www.topteen.in/static/topteenfrontend/assets/images/myPlans.svg" class="w-[22px] h-[22px] mt-[10px]" alt="">
          <p class="text-[14px] leading-[19px] font-semibold mt-[12px] ml-[8px] text-[#828282]">Test prep</p>
        </li>
      </a>
      <a id="dropdownNotificationButton" data-dropdown-toggle="dropdownNotification"
        class="mt-3 relative inline-flex items-center text-sm font-medium text-center text-gray-500 hover:text-gray-900 focus:outline-none dark:hover:text-white dark:text-gray-400 w-[14px] h-[14px]"
        type="button">
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 14 20">
          <path d="M12.133 10.632v-1.8A5.406 5.406 0 0 0 7.979 3.57.946.946 0 0 0 8 3.464V1.1a1 1 0 0 0-2 0v2.364a.946.946 0 0 0 .021.106 5.406 5.406 0 0 0-4.154 5.262v1.8C1.867 13.018 0 13.614 0 14.807 0 15.4 0 16 .538 16h12.924C14 16 14 15.4 14 14.807c0-1.193-1.867-1.789-1.867-4.175ZM3.823 17a3.453 3.453 0 0 0 6.354 0H3.823Z" />
        </svg>
        <div class="ping"></div>
      </a>
      <div id="dropdownNotification"
        class="custom-notification z-50 hidden w-[339px] bg-white divide-y divide-gray-100 rounded-lg shadow dark:bg-gray-800 dark:divide-gray-700"
        aria-labelledby="dropdownNotificationButton">
        <div class="block px-4 py-2 font-medium text-center text-gray-700 rounded-t-lg bg-gray-50 dark:bg-gray-800 dark:text-white">Notifications</div>
        <div class="divide-y divide-gray-100 dark:divide-gray-700 overflow-y-auto h-[250px]">
          <a href="#" class="flex px-4 py-3 hover:bg-gray-100 dark:hover:bg-gray-700">
            <div class="w-full ps-3">
              <div class="text-gray-500 text-sm mb-1.5 dark:text-gray-400">New message from <span class="font-semibold text-gray-900 dark:text-white">Jese Leos</span></div>
              <div class="text-xs text-blue-600 dark:text-blue-500">a few moments ago</div>
            </div>
          </a>
        </div>
        <a href="#" class="block py-2 text-sm font-medium text-center text-gray-900 rounded-b-lg bg-gray-50 hover:bg-gray-100 dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-white">
          <div class="inline-flex items-center">View all</div>
        </a>
      </div>
      <li class="flex relative">
        <div>
          <button class="popTrigr h-[42px] w-[42px] rounded-full -mr-[16px]">
            <img src="https://www.topteen.in/media/upload/users/1/marketer-creates-workflow-automation_1_ORL7EfU.jpg" alt="" class="h-full w-full rounded-full object-cover">
          </button>
        </div>
        <div class="absolute z-80 popDiv w-[144px] inline-block">
          <div id="smallPop" class="hidden px-[10px] py-[10px] bg-[#FFFFFF] shadow-lg rounded-[8px] relative flex flex-col gap-[6px]">
            <a href="{% url 'counselor:user_logout' %}" class="text-black hover:bg-slate-200 text-[16px] font-bold py-1 h-full transition-all duration-[600ms] ease-in-out w-full block text-center">Logout</a>
            <div class="trianglePop absolute left-[50%] -translate-x-[50%]"></div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
