{% load static %}
<div class="mx-auto hidden lg:flex justify-between py-[16px] border-b-[2px] border-[#EBEBEE]">
  <div class="hidden lg:flex justify-between lg:container mx-auto">
    <ul class="flex gap-[24px] mb-0 w-full justify-between">
      <li class="flex">
        <a href="{% url 'counselor:landing' %}">
          <img src="{% static 'topteenfrontend/assets/images/logo.svg' %}" class="w-[38.5px] h-[38.5px]" alt="">
        </a>
        <a href="{% url 'counselor:landing' %}">
          <p class="text-[13.8px] leading-[18px] mt-[14px] ml-[8px] font-bold text-[#494949] tracking-[0.01em]">TOPTEEN</p>
        </a>
      </li>
      <li class="flex items-center">
        {% if user %}
        <div class="user-avatar-container">
          <div class="user-avatar" id="userAvatar" onclick="toggleUserDropdown()">{{ user.username|first|upper }}</div>
          <div class="user-avatar-dropdown" id="userDropdown">
            <div class="user-avatar-dropdown-header">
              <div class="user-avatar-dropdown-name">{{ user.username }}</div>
              <div class="user-avatar-dropdown-email">{{ user.email }}</div>
            </div>
            <form method="post" action="{% url 'counselor:user_logout' %}" style="margin: 0;">
              {% csrf_token %}
              <button type="submit" class="user-avatar-dropdown-item logout">
                <i class="fas fa-sign-out-alt"></i> Logout
              </button>
            </form>
          </div>
        </div>
        {% else %}
        <a href="{% url 'counselor:login_view' %}" class="btn btn-sm me-2" style="background: #3f37c9; color: #fff;">Login</a>
        <a href="{% url 'counselor:signup_view' %}" class="btn btn-sm" style="background: #4CC9F0; color: #fff;">Sign up</a>
        {% endif %}
      </li>
    </ul>
  </div>
</div>
