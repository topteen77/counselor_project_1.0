<head>

    <meta name="googlebot" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon/favicon-16x16.png' %}">
    <link rel="mask-icon" href="{% static 'images/favicon/safari-pinned-tab.svg ' %}" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <link rel="preload" href="{% static 'images/favicon/apple-touch-icon.png' %}" as="image">
    <link rel="preload" href="{% static 'images/favicon/favicon-32x32.png' %}" as="image">
    <link rel="preload" href="{% static 'images/favicon/favicon-16x16.png' %}" as="image">
    <link rel="preload" href="{% static 'images/favicon/safari-pinned-tab.svg' %}" as="image">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
    <title>Every Student, Career Ready | Top Teen</title>

    <!-- Bootstrap CSS -->
    <link rel="preload stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="preload stylesheet" href="{% static 'font/font-style.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <link rel="preload stylesheet" href="https://www.topteen.in/static/topteenfrontend/assets/css/styles.css">
    <link rel="preload stylesheet" href="https://www.topteen.in/static/topteenfrontend/assets/css/custom.css">
    <link rel="preload stylesheet" href="{% static 'topteenfrontend/assets/css/tailwindcustom.css' %}">
    <link rel="preload stylesheet" href="{% static 'topteenfrontend/assets/css/bootstrap.min.css' % }">
    <link rel="preload stylesheet" href="{% static 'topteenfrontend/assets/font/font-style.css' % }">

    <link rel="stylesheet" href="{% static 'css/custom-min.css' %}" type="text/css" media="all" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.1/font/bootstrap-icons.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />
    <!-- custom- js -->
    <style>
        body, p, a, li, button, input, textarea, select, label, div, h1, h2, h3, h4, h5, h6 {
            font-family: "Space Grotesk", sans-serif !important;
        }
    </style>

</head>

<body>
    {% include 'includes/header_dashboard.html' %}

    {% block main %} {% endblock %}

    {% include 'includes/footer_dashboard.html' %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"
        integrity="sha512-bPs7Ae6pVvhOSiIcyUClR7/q2OAsRiovw4vAkX+zJbw3ShAeeqezq50RIIcIURq7Oa20rW2n2q+fyXBNcU9lrw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/jquery.sticky.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Select all alert messages
            var alerts = document.querySelectorAll('.alert');
            
            alerts.forEach(function(alert) {
                // Set a timeout to hide the alert after 3 seconds
                setTimeout(function() {
                    alert.style.opacity = '0';
                    // Optionally, remove the alert from the DOM after fading out
                    setTimeout(function() {
                        alert.style.display = 'none';
                    }, 600); // Match this duration to the fade-out transition duration
                }, 6000); // 3000 milliseconds = 3 seconds
            });
        });
    </script>
    
    <style>       
    
        .alert {
            margin-bottom: 10px; /* Space between messages */
            padding: 15px; /* Padding inside alert */
            border-radius: 5px; /* Rounded corners */
            color: #17a2b8; /* Text color */
            font-size: 16px; /* Font size */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Shadow for depth */
            opacity: 1; /* Initially fully visible */
            transition: opacity 0.6s ease-out; /* Smooth fade-out effect */
            display: flex; /* Flexbox for alignment */
            align-items: center; /* Center content vertically */
        }
    
        .alert-info {
            background-color: #17a2b8; /* Info color */
        }
    
        .alert-success {
            background-color: #28a745; /* Success color */
        }
    
        .alert-warning {
            background-color: #ffc107; /* Warning color */
            color: #212529; /* Dark text for contrast */
        }
    
        .alert-danger {
            background-color: #dc3545; /* Danger color */
        }
    
    </style>

</body>

</html>
