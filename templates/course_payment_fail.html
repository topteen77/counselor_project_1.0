{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Failed</title>
  <link rel="stylesheet" href="{% static 'topteenfrontend/assets/css/bootstrap.min.css' %}">
  <style>
    body { font-family: sans-serif; padding: 40px 20px; text-align: center; }
    .fail-card { max-width: 480px; margin: 0 auto; }
    .fail-icon { font-size: 4rem; color: #dc3545; }
    .btn-retry { background: #3f37c9; color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="fail-card">
    <div class="fail-icon">⚠</div>
    <h1>Payment Failed</h1>
    <p class="text-muted">Your payment could not be processed. Please try again or contact support if the problem persists.</p>
    <a href="{{ payment_page_url }}" class="btn-retry">Retry</a>
    <p class="mt-4 mb-0"><a href="{% url 'counselor:icef_view' %}">Back to courses</a></p>
  </div>
  {% include 'includes/footer_nav_mobile.html' %}
</body>
</html>
