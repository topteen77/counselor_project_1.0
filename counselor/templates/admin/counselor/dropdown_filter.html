{% load i18n %}
<details data-filter-title="{{ title }}" open>
  <summary>
    {% blocktranslate with filter_title=title %} By {{ filter_title }} {% endblocktranslate %}
  </summary>
  <select class="counselor-admin-filter" onchange="window.location=this.value" style="width:100%;max-width:100%;margin:8px 0 4px;">
    {% for choice in choices %}
      <option value="{{ choice.query_string|iriencode }}"{% if choice.selected %} selected{% endif %}>{{ choice.display }}</option>
    {% endfor %}
  </select>
</details>
